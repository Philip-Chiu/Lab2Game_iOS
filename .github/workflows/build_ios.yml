name: Build iOS IPA (Unsigned)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository with LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Checkout LFS Objects
        run: git lfs pull

      - name: Build Xcode Project without Signing
        run: |
          xcodebuild build \
            -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO \
            DEBUG_INFORMATION_FORMAT=dwarf \
            GCC_GENERATE_DEBUGGING_SYMBOLS=NO

      - name: Package Payload into IPA
        run: |
          mkdir -p Payload
          # 複製編譯出來的 .app（同時包含 UnityFramework）
          cp -r build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r game.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-unsigned-ipa
          path: game.ipa
