name: Build iOS IPA (Unsigned)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository with LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Checkout LFS Objects
        run: git lfs pull

      - name: Disable Unity Process Symbols Scripts
        run: |
          # 停用專案中強制執行符號處理的腳本，避免無簽名編譯時崩潰
          sed -i '' 's/.*process_symbols.*/echo "Skipped"/g' Unity-iPhone.xcodeproj/project.pbxproj || true

      - name: Build Xcode Project without Signing
        run: |
          xcodebuild clean build \
            -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO \
            DEBUG_INFORMATION_FORMAT=dwarf \
            GCC_GENERATE_DEBUGGING_SYMBOLS=NO \
            ONLY_ACTIVE_ARCH=NO

      - name: Package Payload into IPA
        run: |
          mkdir -p Payload
          # 尋找編譯出的 .app 檔案並打包
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1)
          cp -r "$APP_PATH" Payload/
          zip -r game.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-unsigned-ipa
          path: game.ipa
